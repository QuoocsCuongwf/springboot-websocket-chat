spring:
  application:
    name: nextchat
  profiles:
    default: dev
  config:
    import:
      - optional:file:../database.yml
      - optional:file:.env
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:messenger_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:change-this-database-password}}
  jpa:
    hibernate:
      ddl-auto: validate

app:
  security:
    jwt:
      # Production profiles reject this development-only default.
      secret: ${NEXTCHAT_JWT_SECRET:development-only-secret-change-me-before-production-12345}
      expiration: ${NEXTCHAT_JWT_EXPIRATION:PT15M}
      refresh-token-expiration: ${NEXTCHAT_JWT_REFRESH_EXPIRATION:P7D}
  seed:
    password: ${NEXTCHAT_SEED_PASSWORD:ChangeMe123!}
