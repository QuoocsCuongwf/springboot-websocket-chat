services:
  postgres:
    image: postgres:16-alpine
    container_name: nextchat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-messenger_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nextchat-postgres-data:/var/lib/postgresql/data
      - ./src/main/resources/sql/messenger_schema_postgres.sql:/docker-entrypoint-initdb.d/01-messenger-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nextchat-postgres-data:
