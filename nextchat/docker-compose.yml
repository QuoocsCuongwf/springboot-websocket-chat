services:
  postgres:
    image: postgres:16-alpine
    container_name: nextchat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nextchat}
      POSTGRES_USER: ${POSTGRES_USER:-nextchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nextchat123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nextchat} -d ${POSTGRES_DB:-nextchat}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: